<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<img id="ref" src="out/thumbs/ref.png" style="display:none"><img id="sky" src="out/thumbs/sky_fill.png" style="display:none"><img id="clean" src="out/thumbs/ref_clean.png" style="display:none"><img id="note" src="out/thumbs/note_layer.png" style="display:none">
<script src="timeline.js"></script><script src="engine.js"></script><script src="props.js"></script><script src="env.js"></script>
<script>
// The user's reference thumbnail, with only the person replaced by our cartoon character.
// Everything is laid out in reference-image pixels (1672×941) and scaled to 1920×1080.
const S = 1920 / 1672;
function polyClip(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.clip(); }
const PERSON_AREA = [[166, 0], [516, 0], [518, 70], [549, 560], [549, 941], [0, 941], [0, 412], [158, 405], [166, 300]];
window.drawThumb = () => {
  const ref = document.getElementById('ref'), sky = document.getElementById('sky');
  ctx.setTransform(S, 0, 0, S, 0, 0);
  // 1) plate with the man painted out (feathered sky fill baked in)
  ctx.drawImage(document.getElementById('clean'), 0, 0);
  // 2) our character, bigger, unclipped — the can and the handwritten note are restored on top
  glow(330, 240, 300, 'rgba(255,230,190,.35)');
  person(330, 2165, 2100, { cap: true, light: 1, top: '#1f2433', mouth: -.5, tilt: -.05 });
  ctx.save(); polyClip([[517, 0], [885, 0], [885, 575], [552, 575], [549, 560], [518, 70]]); ctx.drawImage(ref, 0, 0); ctx.restore();
  ctx.drawImage(document.getElementById('note'), 0, 0);
  // 3) original banner back on top (below its ragged top edge)
  ctx.save(); polyClip([[0, 578], [1120, 578], [1120, 941], [0, 941]]); ctx.drawImage(ref, 0, 0); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
};
</script></body></html>
