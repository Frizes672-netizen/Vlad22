<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script src="engine.js"></script>
<script src="props.js"></script>
<script src="env.js"></script>
<script src="main.js"></script>
<script src="scenes1.js"></script>
<script src="scenes2.js"></script>
<script>
// ===== YouTube thumbnails (drawn at 1920×1080, exported at 1280×720) =====
// heavy outlined headline text, readable at phone size
function headline(s, x, y, size, fill, o = {}) {
  ctx.save(); ctx.font = `900 ${size}px ${F_HEAD}`; ctx.textAlign = o.align || 'left'; ctx.letterSpacing = (o.spacing ?? -2) + 'px';
  ctx.translate(x, y); ctx.rotate(o.rot || 0);
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = size * .25; ctx.shadowOffsetY = size * .06;
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .2; ctx.strokeStyle = o.stroke || '#000'; ctx.strokeText(s, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = fill; ctx.fillText(s, 0, 0);
  if (o.shine) { ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = grad(0, -size, 0, 0, [[0, 'rgba(255,255,255,.45)'], [.5, 'rgba(255,255,255,0)']]); ctx.fillText(s, 0, 0); }
  ctx.restore();
}
function arrow(x0, y0, x1, y1, w, col = '#ff2a2a') {
  const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
  ctx.save(); ctx.translate(x0, y0); ctx.rotate(a);
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 20;
  ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = w * .18; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, -w * .32); ctx.quadraticCurveTo(L * .5, -w * .55, L - w * 1.1, -w * .4); ctx.lineTo(L - w * 1.1, -w); ctx.lineTo(L, 0); ctx.lineTo(L - w * 1.1, w);
  ctx.lineTo(L - w * 1.1, w * .4); ctx.quadraticCurveTo(L * .5, w * .1, 0, w * .32); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
}
function rays(cx, cy, col, n = 18, a = .07) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (let i = 0; i < n; i++) { const t0 = i / n * Math.PI * 2; ctx.fillStyle = col.replace('A', a); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(t0) * 2500, cy + Math.sin(t0) * 2500); ctx.lineTo(cx + Math.cos(t0 + .09) * 2500, cy + Math.sin(t0 + .09) * 2500); ctx.fill(); } ctx.restore(); }
function cashStack(x, y, s) { for (let r = 0; r < 4; r++) for (let c = 0; c < 6 - r; c++) cashBrick(x + (c - (5 - r) / 2) * 118 * s, y - r * 42 * s, 1); }
function finish() { // punchy grade: contrast + vignette, no film grain (thumbnails must stay crisp)
  ctx.save(); ctx.fillStyle = rgrad(W / 2, H / 2, H * .45, W * .75, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.55)']]); ctx.fillRect(0, 0, W, H); ctx.restore();
}
const V = {};
// A — the hero can with real wings + "SUED FOR NO WINGS?" + $13M
V.A = () => {
  bg('#090216', '#05010c'); glow(620, 520, 900, 'rgba(150,60,255,.6)'); glow(620, 520, 420, 'rgba(255,120,220,.25)'); rays(620, 470, 'rgba(255,230,255,A)', 20, .05);
  floor(880, '#140829', '#030106');
  ctx.save(); wings(620, 360, 1.05, 1, { glow: 'rgba(220,180,255,.45)' }); ctx.restore();
  drawCan(620, 560, 680, { rim: 'rgba(230,180,255,.9)', drops: true, rot: -.05 });
  headline('SUED FOR', 1060, 250, 140, '#ffffff', { shine: true });
  headline('NO WINGS?', 1030, 420, 150, '#ffd400', { shine: true, rot: -.02 });
  // money tag
  ctx.save(); ctx.translate(1440, 760); ctx.rotate(-.05); cashStack(0, 120, 1);
  ctx.fillStyle = '#16a34a'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 30; rr(-330, -120, 660, 170, 26); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke(); headline('$13,000,000', 0, 10, 110, '#ffffff', { align: 'center', stroke: '#0b5a26' }); ctx.restore();
  arrow(1180, 600, 900, 520, 70);
  finish();
};
// B — shocked guy close-up + big "$13 MILLION" + gavel
V.B = () => {
  bg('#1a0a06', '#060202'); glow(1360, 420, 900, 'rgba(255,120,40,.35)'); rays(1360, 380, 'rgba(255,220,160,A)', 18, .05);
  ctx.save(); ctx.globalAlpha = .35; ctx.translate(0, 60); courtroom(0); ctx.restore(); ctx.fillStyle = 'rgba(20,6,4,.55)'; ctx.fillRect(0, 0, W, H);
  moneyRain(1.6, 30, 11);
  // the guy, huge and cropped like a face-cam thumbnail
  glow(1450, 500, 600, 'rgba(255,200,140,.25)');
  person(1450, 1560, 1300, { cap: true, shock: true, light: -1, top: '#2b3550', shrug: .9 });
  drawCan(1060, 640, 470, { rim: 'rgba(255,200,150,.8)', rot: -.12, drops: true });
  headline('$13 MILLION', 70, 250, 190, '#3dff6e', { shine: true, stroke: '#04310f' });
  headline('FOR NO WINGS?!', 80, 420, 132, '#ffffff', { shine: true });
  gavel(330, 760, 1.6, Math.PI * .5 + .35);
  finish();
};
// C — "WHO GOT $13M?": one guy with a giant check (X) vs. the crowd
V.C = () => {
  bg('#06102a', '#020611'); glow(960, 560, 1000, 'rgba(60,120,255,.3)');
  usStripes(2, .9);
  giantCheck(700, 660, 860, '$13,000,000', 'One Lucky Guy', -.06, { sign: true });
  person(230, 1160, 780, { cap: true, shock: true, light: 1, shrug: .8 });
  bigX(700, 660, 500, 1);
  // crowd side
  const R = rnd(4); for (let i = 0; i < 26; i++) { const c = i % 9, r = Math.floor(i / 9); person(1180 + c * 85 + (r % 2) * 40, 1100 - r * 90, 300 - r * 20, { silhouette: true, color: '#0b1022', rim: 'rgba(255,214,120,.9)', cap: R() > .5, flip: R() > .5 }); }
  for (let i = 0; i < 30; i++) { ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(1180 + R() * 700, 520 + R() * 260, 9, 0, 7); ctx.fill(); }
  headline('WHO GOT', 1040, 190, 140, '#ffffff', { shine: true });
  headline('THE $13M?', 1000, 350, 150, '#ffd400', { shine: true, rot: -.02 });
  finish();
};

// sticker outline: draw the subject once through a drop-shadow outline filter, then cleanly on top
function mkc() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
const _bk = mkc(), _sub = mkc(), _out = mkc();
function sticker(fn, w = 9, col = '#fff') {
  // render the subject alone on the main canvas, lift it off, then composite outline + subject back
  const bx = _bk.getContext('2d'); bx.clearRect(0, 0, W, H); bx.drawImage(cv, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.restore();
  ctx.save(); fn(); ctx.restore();
  const sx = _sub.getContext('2d'); sx.clearRect(0, 0, W, H); sx.drawImage(cv, 0, 0);
  const ox = _out.getContext('2d'); ox.clearRect(0, 0, W, H);
  for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; ox.drawImage(_sub, Math.cos(a) * w, Math.sin(a) * w); }
  ox.globalCompositeOperation = 'source-in'; ox.fillStyle = col; ox.fillRect(0, 0, W, H); ox.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); ctx.drawImage(_bk, 0, 0);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 12; ctx.drawImage(_out, 0, 0); ctx.shadowColor = 'transparent'; ctx.drawImage(_sub, 0, 0); ctx.restore();
}
function strike(x0, y, x1, w = 18) { ctx.save(); ctx.strokeStyle = '#e3121b'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(x0, y + 14); ctx.lineTo(x1, y - 14); ctx.stroke(); ctx.restore(); }
// D — the $13M → $4.23 twist on a loud yellow background
V.D = () => {
  bg('#ffd400', '#ff9d00'); rays(1380, 520, 'rgba(255,255,255,A)', 22, .16);
  ctx.save(); ctx.globalAlpha = .12; for (let i = 0; i < 40; i++) { const R = rnd(i); ctx.fillStyle = '#000'; ctx.font = `900 ${60 + R() * 60}px ${F_HEAD}`; ctx.fillText('$', R() * W, R() * H); } ctx.restore();
  sticker(() => { wings(1420, 390, .78, .55, { droop: .55 }); drawCan(1420, 560, 640, { rot: .1, drops: true, noShadow: true }); }, 10);
  // falling feathers from the broken wing
  for (let i = 0; i < 7; i++) { const R = rnd(i + 3); ctx.save(); ctx.translate(1180 + R() * 520, 760 + R() * 260); ctx.rotate(R() * 3); drawFeather(90, 22, 1); ctx.restore(); }
  headline('$13,000,000', 70, 260, 150, '#ffffff', { stroke: '#000' }); strike(60, 210, 990, 22);
  headline('$4.23?!', 60, 600, 330, '#e3121b', { stroke: '#fff', shine: true, rot: -.04 });
  headline('PER PERSON', 90, 760, 90, '#000000', { stroke: '#ffd400' });
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'destination-over'; ctx.restore();
};
// E — Red Bull on trial
V.E = () => {
  bg('#160806', '#050202'); ctx.save(); ctx.globalAlpha = .6; courtroom(0); ctx.restore();
  ctx.fillStyle = 'rgba(30,0,0,.45)'; ctx.fillRect(0, 0, W, H); glow(1000, 520, 700, 'rgba(255,40,40,.35)');
  // defendant podium with the can
  sticker(() => { drawCan(1000, 520, 560, { drops: true, noShadow: true }); wings(1000, 330, .42, .7, { droop: .3 }); }, 9);
  ctx.fillStyle = grad(700, 0, 1300, 0, [[0, '#3a2414'], [.5, '#6b4826'], [1, '#2a180c']]); ctx.fillRect(700, 760, 600, 330); ctx.fillStyle = '#8a5f34'; ctx.fillRect(680, 745, 640, 30);
  ctx.save(); ctx.fillStyle = '#d9b44a'; ctx.font = `900 46px ${F_HEAD}`; ctx.textAlign = 'center'; ctx.fillText('DEFENDANT', 1000, 860); ctx.restore();
  // giant gavel mid-swing with motion arcs
  sticker(() => gavel(1600, 300, 2.2, Math.PI * .5 + .35), 8);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(1700, 520, 330 + k * 40, -2.2, -1.6); ctx.stroke(); } ctx.restore();
  headline('RED BULL', 60, 250, 200, '#ff2a2a', { stroke: '#fff', shine: true });
  headline('ON TRIAL', 70, 430, 170, '#ffffff', { shine: true });
  ctx.save(); ctx.fillStyle = '#16a34a'; rr(70, 830, 520, 140, 24); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke(); ctx.restore();
  headline('$13M', 330, 935, 110, '#ffffff', { align: 'center', stroke: '#0b5a26' });
  finish();
};
// F — expectation vs reality meme
V.F = () => {
  // left: expectation — flying over the suburb at sunset
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 955, H); ctx.clip();
  ctx.fillStyle = grad(0, 0, 0, H, [[0, '#3a7bd5'], [.7, '#ffb36b'], [1, '#ff8a4b']]); ctx.fillRect(0, 0, 960, H);
  for (let i = 0; i < 5; i++) house(-60 + i * 220, 1080, 160, 110, { body: '#2b2338', roof: '#211b2c' });
  glow(480, 420, 500, 'rgba(255,255,220,.5)');
  sticker(() => { person(480, 830, 560, { cap: true, armUp: 1, holdCan: true, light: 1, backWings: { s: .62, spread: 1, flap: 0 } }); }, 9);
  ctx.restore();
  // right: reality — dark couch, tired guy, tiny check
  ctx.save(); ctx.beginPath(); ctx.rect(965, 0, 955, H); ctx.clip();
  bg('#1d1a22', '#09080c'); ctx.fillStyle = '#16131b'; ctx.fillRect(965, 0, 955, H); glow(1440, 300, 600, 'rgba(120,140,200,.25)');
  ctx.fillStyle = '#3a2f4a'; rr(1040, 760, 820, 260, 60); ctx.fill(); rr(1000, 640, 900, 180, 60); ctx.fill();
  sticker(() => { person(1440, 1040, 560, { cap: true, shock: true, light: -1, holdCan: true, armUp: .3, shrug: .4 }); }, 9);
  sticker(() => giantCheck(1560, 340, 520, '$4.23', 'You', .08), 8);
  ctx.restore(); headline('$4.23', 1640, 990, 165, '#ff2a2a', { align: 'center', stroke: '#fff', shine: true, rot: -.06 }); ctx.save();
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.fillRect(955, 0, 10, H);
  headline('EXPECTATION', 480, 150, 104, '#ffffff', { align: 'center', shine: true });
  headline('REALITY', 1440, 150, 120, '#ffd400', { align: 'center', shine: true });
  finish();
};

window.drawThumb = k => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; V[k](); };
</script>
</body></html>
